name: Unity activation file (run once, then follow game-ci docs)
on:
  workflow_dispatch:
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: alf
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.alf.outputs.filePath }}
          path: ${{ steps.alf.outputs.filePath }}
